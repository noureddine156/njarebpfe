<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - Formulaire Dynamique</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="form-wrapper">
            <h1>Créer un compte</h1>
            <p class="subtitle">Rejoignez-nous en quelques étapes simples</p>
            
            <form id="registrationForm" novalidate>
                <!-- Nom complet -->
                <div class="form-group">
                    <label for="fullname">Nom complet <span class="required">*</span></label>
                    <input 
                        type="text" 
                        id="fullname" 
                        name="fullname" 
                        placeholder="Entrez votre nom complet"
                        required
                    >
                    <span class="error-message" id="fullname-error"></span>
                    <span class="success-icon">✓</span>
                </div>

                <!-- Email -->
                <div class="form-group">
                    <label for="email">Adresse email <span class="required">*</span></label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="exemple@email.com"
                        required
                    >
                    <span class="error-message" id="email-error"></span>
                    <span class="success-icon">✓</span>
                </div>

                <!-- Téléphone -->
                <div class="form-group">
                    <label for="phone">Numéro de téléphone</label>
                    <input 
                        type="tel" 
                        id="phone" 
                        name="phone" 
                        placeholder="+33 6 12 34 56 78"
                    >
                    <span class="error-message" id="phone-error"></span>
                    <span class="success-icon">✓</span>
                </div>

                <!-- Mot de passe -->
                <div class="form-group">
                    <label for="password">Mot de passe <span class="required">*</span></label>
                    <div class="password-input-wrapper">
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            placeholder="Créez un mot de passe sécurisé"
                            required
                        >
                        <button type="button" class="toggle-password" id="togglePassword">
                            <span class="eye-icon">👁️</span>
                        </button>
                    </div>
                    <span class="error-message" id="password-error"></span>
                    <span class="success-icon">✓</span>
                    
                    <!-- Force du mot de passe -->
                    <div class="password-strength">
                        <div class="strength-bars">
                            <div class="strength-bar"></div>
                            <div class="strength-bar"></div>
                            <div class="strength-bar"></div>
                            <div class="strength-bar"></div>
                        </div>
                        <span class="strength-text">Force du mot de passe</span>
                    </div>
                </div>

                <!-- Confirmation mot de passe -->
                <div class="form-group">
                    <label for="confirmPassword">Confirmer le mot de passe <span class="required">*</span></label>
                    <input 
                        type="password" 
                        id="confirmPassword" 
                        name="confirmPassword" 
                        placeholder="Confirmez votre mot de passe"
                        required
                    >
                    <span class="error-message" id="confirmPassword-error"></span>
                    <span class="success-icon">✓</span>
                </div>

                <!-- Date de naissance -->
                <div class="form-group">
                    <label for="birthdate">Date de naissance <span class="required">*</span></label>
                    <input 
                        type="date" 
                        id="birthdate" 
                        name="birthdate"
                        required
                    >
                    <span class="error-message" id="birthdate-error"></span>
                    <span class="success-icon">✓</span>
                </div>

                <!-- Genre -->
                <div class="form-group">
                    <label>Genre</label>
                    <div class="radio-group">
                        <label class="radio-label">
                            <input type="radio" name="gender" value="homme">
                            <span>Homme</span>
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="gender" value="femme">
                            <span>Femme</span>
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="gender" value="autre">
                            <span>Autre</span>
                        </label>
                    </div>
                </div>

                <!-- Conditions d'utilisation -->
                <div class="form-group checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="terms" name="terms" required>
                        <span>J'accepte les <a href="#" class="link">conditions d'utilisation</a> et la <a href="#" class="link">politique de confidentialité</a> <span class="required">*</span></span>
                    </label>
                    <span class="error-message" id="terms-error"></span>
                </div>

                <!-- Newsletter -->
                <div class="form-group checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="newsletter" name="newsletter">
                        <span>Je souhaite recevoir les actualités et offres par email</span>
                    </label>
                </div>

                <!-- Bouton de soumission -->
                <button type="submit" class="submit-btn" id="submitBtn">
                    <span class="btn-text">S'inscrire</span>
                    <span class="btn-loader"></span>
                </button>

                <!-- Message de succès -->
                <div class="success-message" id="successMessage">
                    <span class="check-icon">✓</span>
                    <p>Inscription réussie ! Bienvenue parmi nous.</p>
                </div>
            </form>

            <div class="form-footer">
                <p>Vous avez déjà un compte ? <a href="#" class="link">Se connecter</a></p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
